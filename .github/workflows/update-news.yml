name: Atualizar notícias diariamente

# Robô das notícias de JOGOS (IGN e GameSpot, traduzidas).
# Grava o news.json no repositório. Quem manda o site pra HostGator é o
# workflow "Enviar site para a HostGator" (deploy-hostgator.yml).

on:
  schedule:
    # a cada 3 horas, no minuto 17 (horário UTC). Evita o minuto :00, que o GitHub atrasa.
    - cron: "17 */3 * * *"
  workflow_dispatch: # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write # necessário pro robô poder salvar o news.json

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências do robô
        working-directory: ./ingest
        run: npm install

      - name: Buscar notícias e gerar news.json
        working-directory: ./ingest
        run: node fetch-news.js

      - name: Salvar o news.json (se mudou algo)
        run: |
          git config user.name "reynventando-bot"
          git config user.email "bot@reynventando.tv"
          git add public/data/news.json
          git diff --quiet --cached || git commit -m "chore: atualiza notícias automaticamente"
          git pull --rebase origin main
          git push
