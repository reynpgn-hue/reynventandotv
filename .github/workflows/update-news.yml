name: Atualizar notícias diariamente

on:
  schedule:
    # roda todo dia às 08:00 (horário de Brasília = 11:00 UTC)
    - cron: "0 11 * * *"
  workflow_dispatch: # permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write # necessário pra o próprio workflow poder commitar o news.json atualizado

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências do robô
        working-directory: ./ingest
        run: npm install

      - name: Buscar notícias e gerar news.json
        working-directory: ./ingest
        run: node fetch-news.js

      - name: Commitar o news.json atualizado (se mudou algo)
        run: |
          git config user.name "reynventando-bot"
          git config user.email "bot@reynventando.tv"
          git add public/data/news.json
          git diff --quiet --cached || git commit -m "chore: atualiza notícias automaticamente"
          git push
