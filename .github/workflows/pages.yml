name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    # precisa ser IGUAL ao "name:" de cada workflow de notícias
    workflows:
      - "Atualizar notícias diariamente"
      - "Atualizar notícias de tecnologia, filmes e shows"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar a pasta public
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
