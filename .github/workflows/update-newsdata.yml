name: Atualizar noticias

on:
  schedule:
    - cron: "0 */3 * * *"   # a cada 3 horas (horário UTC)
  workflow_dispatch:         # permite rodar manualmente

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: |
          if [ -f ingest/package.json ]; then
            cd ingest && npm install
          else
            npm install
            npm install rss-parser
          fi

      - name: Rodar o robô de notícias
        run: node ingest/fetch-news.js

      - name: Enviar public/data/ para a HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.reynventando.com.br
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./public/data/
          server-dir: ./data/
