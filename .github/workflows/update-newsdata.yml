name: Atualizar notícias de tecnologia, filmes e shows

# Robô das notícias de TECNOLOGIA, FILMES, SÉRIES e SHOWS (API NewsData.io).
# Precisa do segredo NEWSDATA_API_KEY (GitHub > Settings > Secrets and variables > Actions).

on:
  schedule:
    # a cada 6 horas, no minuto 43 (horário UTC): uns 40 créditos por dia, de 200 que o plano grátis dá
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar notícias na NewsData.io
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: node ingest/fetch-newsdata.js

      - name: Salvar o noticias-extra.json (se mudou algo)
        run: |
          git config user.name "reynventando-bot"
          git config user.email "bot@reynventando.tv"
          git add public/data/noticias-extra.json
          git diff --quiet --cached || git commit -m "chore: atualiza noticias de tecnologia, filmes e shows"
          git pull --rebase origin main
          git push
